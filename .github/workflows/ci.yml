name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:db
      - run: npm run lint
      # PageProps/LayoutProps are generated route types; tsc needs them before a build has run.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
